name: Meetin-OS Windows

on:
  push:
    paths: ["windows/**", "web/public/downloads/Meetin-OS-Windows.exe", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "web/public/downloads/Meetin-OS-Windows.exe", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS packaging tool
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build and test the current Windows sources
        shell: pwsh
        run: ./windows/build-test.ps1
      - name: Install and launch the freshly built package
        shell: pwsh
        run: |
          $installer = Resolve-Path 'artifacts/windows/Meetin-OS-Windows-0.1.1.exe'
          $manifest = Get-Content 'artifacts/windows/build-manifest.json' | ConvertFrom-Json
          if ($manifest.commit -ne $env:GITHUB_SHA) { throw 'Wrong source commit' }
          $setup = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed with exit code $($setup.ExitCode)" }

          $folder = Join-Path $env:LOCALAPPDATA 'Programs/Meetin-OS'
          $exe = Join-Path $folder 'Meetin-OS.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Meetin-OS.lnk'
          if (!(Test-Path $exe) -or !(Test-Path $shortcut)) { throw 'Application or Start menu shortcut missing' }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          if ($link.TargetPath -ne $exe) { throw "Start menu points to $($link.TargetPath)" }

          $installedSource = Get-Content (Join-Path $folder 'BuildSource.json') | ConvertFrom-Json
          if ($installedSource.commit -ne $env:GITHUB_SHA -or $installedSource.version -ne '0.1.1') { throw 'Wrong installed source/version' }
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike '0.1.1*') { throw 'Wrong application version' }
          $app = Start-Process -FilePath $exe -PassThru
          try {
            for ($i = 0; $i -lt 20; $i++) {
              $app.Refresh()
              if ($app.HasExited) { throw "Meetin-OS exited with code $($app.ExitCode)" }
              if ($app.MainWindowTitle -eq 'Meetin-OS') { break }
              Start-Sleep -Milliseconds 500
            }
            if ($app.MainWindowTitle -ne 'Meetin-OS') { throw 'The notebook window did not open' }
            Write-Host 'Meetin-OS opened from its installed path.'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }

          $uninstall = Start-Process -FilePath (Join-Path $folder 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $exe) -or (Test-Path $shortcut)) {
            throw 'Uninstall did not remove the installed app and shortcut'
          }

      - name: Publish validated test installer
        uses: actions/upload-artifact@v4
        with:
          name: Meetin-OS-Windows-0.1.1-${{ github.sha }}
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
